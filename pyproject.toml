[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redline"
version = "1.0.0"
description = "Reproducible RL environment simulator for AI financial auditors"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["tzdata==2025.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
include = ["audit_env*"]
